[project]
name = "solartriage-ml"
version = "0.1.0"
requires-python = ">=3.14,<3.15,!=3.14.1"
dependencies = [
    "numpy>=2.1",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "pillow>=11",
    "scikit-learn>=1.6",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
