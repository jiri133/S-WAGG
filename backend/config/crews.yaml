# Echipele de mentenanță, citite de planner (DESIGN_SPEC §7). Editabile de inginerul O&M.
#   type     = echipa cerută de ordinul de lucru (decision_rules.yaml › classes.*.crew)
#   skills   = piesele pe care echipa le poate schimba (un ordin fără piesă merge la orice echipă de tipul lui)
#   start    = ora de început a turei; hours = câte ore lucrează pe zi
#   weekdays = zilele în care lucrează; days_off = zilele libere (concediu), ca date ISO
# Programarea se face doar luni–vineri; E1 și E2 pot schimba amândouă module, ca să împartă lucrul.
crews:
  - id: E1
    type: electrical
    people: [Electrician 1, Electrician 2]
    skills: [modul, dioda bypass, conectori]
    start: "08:00"
    hours: 7
    weekdays: [Mon, Tue, Wed, Thu, Fri]
    days_off: []
  - id: E2
    type: electrical
    people: [Electrician 3, Electrician 4]
    skills: [modul, dioda bypass, conectori]
    start: "07:00"
    hours: 8
    weekdays: [Mon, Tue, Wed, Thu, Fri]
    days_off: ["2026-11-11"]
  - id: C1
    type: cleaning
    people: [Tehnician curățenie 1]
    skills: []
    start: "09:00"
    hours: 6
    weekdays: [Mon, Tue, Wed, Thu, Fri]
    days_off: []
