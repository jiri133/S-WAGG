# Decision layer (DESIGN_SPEC §7, ADR 0001). Explicit rules, editable by the O&M engineer.
# Every finding quotes the calculation and the rule in `evidence.rule_applied`.

# 1. Safety net: ΔT ≥ 20 K → critical + immediate alert, whatever class the model picked.
#    The order then goes to `crew`.
safety:
  delta_t_min_k: 20
  urgency: critical
  alert: true
  crew: electrical

# 3. Score = expected risk = Σ_c p(c) × weight(base urgency of c) × loss kWh/day(c).
#    Urgency = base urgency of the class with the largest term (unless safety trips).
#    Ties go to the higher model confidence.
urgency_weights:
  critical: 10
  high: 5
  medium: 2
  low: 1

# 2. Base urgency and the work order content, per class.
classes:
  hot_cell:
    urgency: medium
    crew: electrical
    part: modul
    est_hours: 2.0
    check: Verifică celula cu camera IR de mână; înlocuiește modulul dacă punctul fierbinte persistă.
  multi_hot:
    urgency: medium
    crew: electrical
    part: modul
    est_hours: 2.0
    check: Verifică celulele fierbinți și cutia de joncțiune; înlocuiește modulul la nevoie.
  diode_substring:
    urgency: high
    crew: electrical
    part: dioda bypass
    est_hours: 1.5
    check: Măsoară diodele bypass din cutia de joncțiune; înlocuiește dioda defectă.
  module_offline:
    urgency: high
    crew: electrical
    part: conectori
    est_hours: 0.5
    check: Verifică conectorii MC4 și cablul string-ului; măsoară tensiunea în gol a modulului.
  soiling:
    urgency: low
    crew: cleaning
    part: null
    est_hours: 0.25
    check: Curăță modulul cu apă demineralizată.
  shadow_vegetation:
    urgency: low
    crew: cleaning
    part: null
    est_hours: 0.25
    check: Taie vegetația din fața rândului; verifică dacă umbra dispare.
  other:
    urgency: low
    crew: electrical
    part: modul
    est_hours: 2.0
    check: Inspecție vizuală pentru fisuri; înlocuiește modulul dacă e fisurat.
  ok:
    urgency: low
    crew: electrical
    part: null
    est_hours: 0.25
    check: Reverificare termografică; modelul nu e sigur că modulul e în regulă.

# Review "inconclusive" → a reinspection task instead of a repair.
reinspection:
  crew: electrical
  part: null
  est_hours: 0.5

# Greedy planner (DESIGN_SPEC §7). No weather yet (ticket 28).
planner:
  horizon_days: 5
  capacity_h: {electrical: 7.0, cleaning: 7.0}  # one crew of each, hours/day
  travel_min: {same_row: 0, between_rows: 10, between_blocks: 20}
  loss_window_days: 30  # total_loss_avoided_kwh = kWh/day × days left in this window
  # weather.json: electricians stop in the rain, cleaning stops in wind over this
  cleaning_max_wind_ms: 10
