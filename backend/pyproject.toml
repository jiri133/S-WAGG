[project]
name = "hackathon-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
    "numpy>=2.1",
    "pillow>=11",
    "onnxruntime>=1.31.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

# Grad-CAM only (ticket 14): CPU wheels, no CUDA download.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
